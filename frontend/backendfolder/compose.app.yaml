name: yendaroute_backend

services:
  db:
    image: postgis/postgis:16-3.5
    container_name: yendaroute_db
    environment:
      POSTGRES_USER: yenda
      POSTGRES_PASSWORD: yenda_dev_password
      POSTGRES_DB: yendaroute
    ports:
      - "5433:5432"
    volumes:
      - yendaroute_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yenda -d yendaroute"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    image: yendaroute-api:1.0
    container_name: yendaroute_api
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: yenda
      DB_PASS: yenda_dev_password
      DB_NAME: yendaroute
      DB_SSL: "false"
      JWT_SECRET: c85dc555224ca82058c7f7182d209cdc9906f14f6702d8e967cc93a033f0a327
      JWT_EXPIRES_IN: 1h
      PAYMENT_WEBHOOK_SECRET: yendaroute_webhook_secret
      HOLD_MINUTES: 10
    ports:
      # Defaults to 3000 to match the handoff URL (http://localhost:3000/docs).
      # If host 3000 is already used by the Next.js frontend, run with API_PORT=3001.
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  yendaroute_pgdata:
